# Grafana Dashboard Provisioning
apiVersion: 1

providers:
  - name: 'WhatsApp RMD Dashboards'
    orgId: 1
    folder: 'RMD'
    folderUid: 'rmd'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
