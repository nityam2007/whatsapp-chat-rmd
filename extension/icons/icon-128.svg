<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="eye" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#90cdf4"/>
      <stop offset="100%" style="stop-color:#4299e1"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)" stroke="#4299e1" stroke-width="2"/>
  
  <!-- Eye shape -->
  <ellipse cx="64" cy="64" rx="40" ry="28" fill="none" stroke="url(#eye)" stroke-width="4"/>
  
  <!-- Iris -->
  <circle cx="64" cy="64" r="18" fill="url(#eye)"/>
  
  <!-- Pupil -->
  <circle cx="64" cy="64" r="8" fill="#1a1a2e"/>
  
  <!-- Highlight -->
  <circle cx="58" cy="58" r="4" fill="#ffffff" opacity="0.8"/>
</svg>
